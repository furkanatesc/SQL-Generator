[pytest]
pythonpath = .
testpaths = tests
markers =
    manual_llm: manual real LLM tests that require API keys
    integration: tests that require external services (e.g. local Docker)
    postgres: tests that require a local Docker PostgreSQL (skipped if unavailable)
    oracle: tests that require a local Docker Oracle (skipped if unavailable)
    mysql: tests that require a local Docker MySQL (skipped if unavailable)
