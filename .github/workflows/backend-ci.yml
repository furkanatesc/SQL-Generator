name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    # Local Docker PostgreSQL for Sprint 25.8 read-only adapter integration tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sqlgen
          POSTGRES_PASSWORD: sqlgen
          POSTGRES_DB: sqlgen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlgen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed PostgreSQL integration schema
        env:
          PGPASSWORD: sqlgen
        run: |
          psql -h localhost -p 5432 -U sqlgen -d sqlgen_test \
            -f tests/fixtures/postgres/seed.sql

      - name: Run tests
        env:
          NL2SQL_DEBUG_ENDPOINTS_ENABLED: "true"
          POSTGRES_TEST_HOST: localhost
          POSTGRES_TEST_PORT: "5432"
          POSTGRES_TEST_DB: sqlgen_test
          POSTGRES_TEST_USER: sqlgen
          POSTGRES_TEST_PASSWORD: sqlgen
        run: |
          pytest -q

      - name: Run eval smoke profile and write report
        run: |
          python -m app.eval.run_eval --profile smoke --json --output /tmp/eval_smoke_report.json

      - name: Run eval gate CLI on generated smoke report
        run: |
          python -m evals.eval_gate_cli /tmp/eval_smoke_report.json

      - name: Run golden eval profile and write report
        run: |
          python -m app.eval.run_eval --profile golden --json --output /tmp/golden_eval_report.json

      - name: Run eval gate CLI on generated golden report
        run: |
          python -m evals.eval_gate_cli /tmp/golden_eval_report.json

      - name: Run accuracy regression gate on generated golden report
        run: |
          python -m evals.regression_gate_cli /tmp/golden_eval_report.json

      - name: Schema benchmark perf gate (deterministic counters)
        run: |
          python -m benchmarks.bench_cli --gate --scales 100,500,1000

      - name: Build backend Docker image
        run: |
          docker build -t sqlgen-backend:test .

      - name: Run backend Docker smoke test
        run: |
          docker run -d --name sqlgen-backend-smoke -p 8000:8000 \
            -e NL2SQL_DEBUG_ENDPOINTS_ENABLED=true \
            -e NL2SQL_ENVIRONMENT=ci \
            sqlgen-backend:test

          trap 'docker logs sqlgen-backend-smoke || true; docker rm -f sqlgen-backend-smoke || true' EXIT

          for i in {1..30}; do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done

          exit 1

  oracle-integration:
    name: Oracle integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: sqlgen
          APP_USER: sqlgen
          APP_USER_PASSWORD: sqlgen
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 20s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 90s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Seed Oracle integration schema
        env:
          ORACLE_TEST_HOST: localhost
          ORACLE_TEST_PORT: "1521"
          ORACLE_TEST_SERVICE: FREEPDB1
          ORACLE_TEST_USER: sqlgen
          ORACLE_TEST_PASSWORD: sqlgen
        run: |
          python -m app.evaluation.oracle_seed
      - name: Run Oracle integration tests
        env:
          NL2SQL_DEBUG_ENDPOINTS_ENABLED: "true"
          ORACLE_TEST_HOST: localhost
          ORACLE_TEST_PORT: "1521"
          ORACLE_TEST_SERVICE: FREEPDB1
          ORACLE_TEST_USER: sqlgen
          ORACLE_TEST_PASSWORD: sqlgen
        run: |
          pytest -m oracle -q

  mysql-integration:
    name: MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sqlgen
          MYSQL_DATABASE: sqlgen_test
          MYSQL_USER: sqlgen
          MYSQL_PASSWORD: sqlgen
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -psqlgen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Seed MySQL integration schema
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: "3306"
          MYSQL_TEST_DB: sqlgen_test
          MYSQL_TEST_USER: sqlgen
          MYSQL_TEST_PASSWORD: sqlgen
        run: |
          python -m app.evaluation.mysql_seed
      - name: Run MySQL integration tests
        env:
          NL2SQL_DEBUG_ENDPOINTS_ENABLED: "true"
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_PORT: "3306"
          MYSQL_TEST_DB: sqlgen_test
          MYSQL_TEST_USER: sqlgen
          MYSQL_TEST_PASSWORD: sqlgen
        run: |
          pytest -m mysql -q

  sqlserver-integration:
    name: SQL Server integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Sqlgen_Str0ng!Pass"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Seed SQL Server integration schema
        env:
          MSSQL_TEST_HOST: 127.0.0.1
          MSSQL_TEST_PORT: "1433"
          MSSQL_TEST_DB: sqlgen_test
          MSSQL_TEST_USER: sqlgen_ro
          MSSQL_TEST_PASSWORD: "Sqlgen_Ro0!Pass"
          MSSQL_TEST_ADMIN_USER: sa
          MSSQL_TEST_ADMIN_PASSWORD: "Sqlgen_Str0ng!Pass"
        run: |
          python -m app.evaluation.mssql_seed
      - name: Run SQL Server integration tests
        env:
          NL2SQL_DEBUG_ENDPOINTS_ENABLED: "true"
          MSSQL_TEST_HOST: 127.0.0.1
          MSSQL_TEST_PORT: "1433"
          MSSQL_TEST_DB: sqlgen_test
          MSSQL_TEST_USER: sqlgen_ro
          MSSQL_TEST_PASSWORD: "Sqlgen_Ro0!Pass"
        run: |
          pytest -m sqlserver -q

  # Sprint 32.0 — boot the production compose stack (backend + frontend images) and
  # smoke it: liveness, production readiness and the SPA. Static shape is guarded by
  # backend/tests/test_prod_compose_contract.py.
  prod-compose-smoke:
    name: Production compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: docker-compose.prod.yml
      # Used by the smoke requests below; the backend receives it only as a Docker secret file.
      NL2SQL_API_KEY: ci-prod-compose-smoke-key
      SQLGEN_API_KEY_SECRET_FILE: ./secrets/nl2sql_api_key
      NL2SQL_CORS_ALLOW_ORIGINS: '["http://localhost:8080"]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write the API key Docker secret
        run: |
          mkdir -p secrets
          printf '%s\n' "$NL2SQL_API_KEY" > secrets/nl2sql_api_key
          chmod 0444 secrets/nl2sql_api_key

      - name: Validate compose file
        run: docker compose config -q

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke test backend and frontend
        run: |
          curl -fsS http://localhost:8000/health
          # /ready is 200 only with production-safe config, an API key, a reachable DB
          # and a writable upload dir (i.e. the volumes are owned by the non-root user).
          curl -fsS http://localhost:8000/ready
          # Sprint 32.7: component checks; nothing fails in a healthy production stack.
          curl -fsS http://localhost:8000/ready | python3 -c "import json,sys; c=json.load(sys.stdin)['checks']; sys.exit(0 if c['database']['status']=='ok' and c['migrations']['status']=='ok' and c['disk']['status']!='fail' and all(v['status']!='fail' for v in c.values()) else 1)"
          curl -fsS http://localhost:8080/ | grep -qi "<div id=\"app\""
          # Sprint 32.6: production rate limits are active (header on a normal response).
          curl -fsS -D - -o /dev/null http://localhost:8000/api/jobs -H "X-API-Key: $NL2SQL_API_KEY" \
            | grep -qi "^x-ratelimit-limit: 300"

      - name: API key is a Docker secret, not a container env value
        run: |
          # Sprint 32.2: the key authenticates (read from /run/secrets) ...
          curl -fsS http://localhost:8000/api/v1/workspaces -H "X-API-Key: $NL2SQL_API_KEY" > /dev/null
          # ... a wrong key is rejected ...
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/workspaces -H 'X-API-Key: wrong')" = 403
          # ... and the value never appears in the container environment.
          ! docker compose exec -T backend env | grep -F "$NL2SQL_API_KEY"

      - name: Persistence survives container recreation
        run: |
          curl -fsS -X POST http://localhost:8000/api/v1/workspaces \
            -H "X-API-Key: $NL2SQL_API_KEY" -H "Content-Type: application/json" \
            -d '{"name":"Smoke","slug":"smoke"}'
          docker compose up -d --force-recreate --wait --wait-timeout 180 backend
          curl -fsS http://localhost:8000/api/v1/workspaces -H "X-API-Key: $NL2SQL_API_KEY" \
            | grep -q '"slug":"smoke"'

      - name: Database migrations are recorded and up to date
        run: |
          # Sprint 32.3: the app DB is migrated on start; the trace DB is created lazily on the
          # first trace write, so before `upgrade` it may not exist yet (but must not lag behind).
          docker compose exec -T backend python -m app.migrations status | tee status.json
          python3 -c "import json,sys; r={d['db']: d for d in json.load(open('status.json'))}; a=r['app']; t=r['trace']; sys.exit(0 if a['exists'] and not a['pending'] and not a['ahead'] and (not t['exists'] or (not t['pending'] and not t['ahead'])) else 1)"
          # The operator CLI brings both databases to the latest version.
          docker compose exec -T backend python -m app.migrations upgrade
          docker compose exec -T backend python -m app.migrations status | tee status.json
          python3 -c "import json,sys; r=json.load(open('status.json')); sys.exit(0 if all(d['exists'] and not d['pending'] and not d['ahead'] for d in r) else 1)"

      - name: Jobs are executed by the worker service
        run: |
          # Sprint 32.4: the API only enqueues; the worker claims the job. Without an LLM key
          # the job fails fast, which is enough to prove who ran it and that logs persist.
          job_id=$(curl -fsS -X POST http://localhost:8000/api/jobs/without-file \
            -H "X-API-Key: $NL2SQL_API_KEY" -H "Content-Type: application/json" \
            -d '{"natural_query":"smoke"}' | python3 -c "import json,sys; print(json.load(sys.stdin)['job']['id'])")
          for i in {1..30}; do
            status=$(curl -fsS "http://localhost:8000/api/jobs/$job_id" -H "X-API-Key: $NL2SQL_API_KEY" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            [ "$status" = failed ] && break
            sleep 1
          done
          test "$status" = failed
          docker compose logs worker | grep -q "running job $job_id"
          # The log line written by the worker process is streamed by the API from job_logs.
          curl -fsS --max-time 15 "http://localhost:8000/api/jobs/$job_id/stream" \
            -H "X-API-Key: $NL2SQL_API_KEY" | grep -q "NVIDIA API"
          # Sprint 32.5: a missing LLM key is deterministic, so no retry and no dead letter.
          curl -fsS http://localhost:8000/api/v1/admin/queue -H "X-API-Key: $NL2SQL_API_KEY" \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['data']; sys.exit(0 if d['execution_mode']=='worker' and d['counts']['failed']>=1 and d['dead_lettered']==0 and d['retry_scheduled']==0 else 1)"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
