name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          NL2SQL_DEBUG_ENDPOINTS_ENABLED: "true"
        run: |
          pytest -q

      - name: Run eval smoke profile and write report
        run: |
          python -m app.eval.run_eval --profile smoke --json --output /tmp/eval_smoke_report.json

      - name: Run eval gate CLI on generated smoke report
        run: |
          python -m evals.eval_gate_cli /tmp/eval_smoke_report.json

      - name: Run golden eval profile and write report
        run: |
          python -m app.eval.run_eval --profile golden --json --output /tmp/golden_eval_report.json

      - name: Run eval gate CLI on generated golden report
        run: |
          python -m evals.eval_gate_cli /tmp/golden_eval_report.json
