name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    # Local Docker PostgreSQL for Sprint 25.8 read-only adapter integration tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sqlgen
          POSTGRES_PASSWORD: sqlgen
          POSTGRES_DB: sqlgen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sqlgen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          NL2SQL_DEBUG_ENDPOINTS_ENABLED: "true"
          POSTGRES_TEST_HOST: localhost
          POSTGRES_TEST_PORT: "5432"
          POSTGRES_TEST_DB: sqlgen_test
          POSTGRES_TEST_USER: sqlgen
          POSTGRES_TEST_PASSWORD: sqlgen
        run: |
          pytest -q

      - name: Run eval smoke profile and write report
        run: |
          python -m app.eval.run_eval --profile smoke --json --output /tmp/eval_smoke_report.json

      - name: Run eval gate CLI on generated smoke report
        run: |
          python -m evals.eval_gate_cli /tmp/eval_smoke_report.json

      - name: Run golden eval profile and write report
        run: |
          python -m app.eval.run_eval --profile golden --json --output /tmp/golden_eval_report.json

      - name: Run eval gate CLI on generated golden report
        run: |
          python -m evals.eval_gate_cli /tmp/golden_eval_report.json

      - name: Build backend Docker image
        run: |
          docker build -t sqlgen-backend:test .

      - name: Run backend Docker smoke test
        run: |
          docker run -d --name sqlgen-backend-smoke -p 8000:8000 \
            -e NL2SQL_DEBUG_ENDPOINTS_ENABLED=true \
            -e NL2SQL_ENVIRONMENT=ci \
            sqlgen-backend:test

          trap 'docker logs sqlgen-backend-smoke || true; docker rm -f sqlgen-backend-smoke || true' EXIT

          for i in {1..30}; do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done

          exit 1
