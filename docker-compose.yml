# Sprint 29.0 — local PostgreSQL parity with CI (backend-ci.yml services.postgres).
# Usage: docker compose up -d postgres  ->  cd backend && pytest -m postgres
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sqlgen
      POSTGRES_PASSWORD: sqlgen
      POSTGRES_DB: sqlgen_test
    ports:
      - "5432:5432"
    volumes:
      - ./backend/tests/fixtures/postgres/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlgen"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sprint 29.4 — local Oracle parity with CI (backend-ci.yml oracle-integration job).
  # Usage: docker compose up -d oracle  ->  cd backend && pytest -m oracle
  # Re-seeding: the seed applies once on a fresh volume; `docker compose down -v` to reset.
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: sqlgen
      APP_USER: sqlgen
      APP_USER_PASSWORD: sqlgen
    ports:
      - "1521:1521"
    volumes:
      - ./backend/tests/fixtures/oracle/seed.sql:/container-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  # Sprint 29.5 — local MySQL parity with CI (backend-ci.yml mysql-integration job).
  # Usage: docker compose up -d mysql  ->  cd backend && pytest -m mysql
  # Re-seeding: the seed applies once on a fresh volume; `docker compose down -v` to reset.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sqlgen
      MYSQL_DATABASE: sqlgen_test
      MYSQL_USER: sqlgen
      MYSQL_PASSWORD: sqlgen
    ports:
      - "3306:3306"
    volumes:
      - ./backend/tests/fixtures/mysql/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psqlgen"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
