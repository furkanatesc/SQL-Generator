# Sprint 32.0 — Production Docker Compose.
# Separate from docker-compose.yml, which only provides local/CI test databases.
#
# Usage:
#   cp .env.prod.example .env      # fill in real values; .env is gitignored
#   mkdir -p secrets && openssl rand -hex 32 > secrets/nl2sql_api_key && chmod 0444 secrets/nl2sql_api_key
#   docker compose -f docker-compose.prod.yml up -d --build --wait
#
# Contract guard: backend/tests/test_prod_compose_contract.py
# Runbook:        docs/production-runbook.md ("Docker Compose (Production)")

services:
  backend:
    build: ./backend
    image: sqlgen-backend:${SQLGEN_IMAGE_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SQLGEN_BACKEND_PORT:-8000}:8000"
    environment:
      # Production-safe settings are pinned, not left to the operator.
      NL2SQL_ENVIRONMENT: production
      NL2SQL_DEBUG_ENDPOINTS_ENABLED: "false"
      NL2SQL_UPLOAD_DIR: /app/uploads
      SQLGEN_DB_PATH: /app/data/sqlgen.db
      NL2SQL_TRACE_DB_PATH: /app/data/nl2sql_traces.db
      # Sprint 32.2: the API key is a Docker secret (file), never a plain env value.
      NL2SQL_API_KEY_FILE: /run/secrets/nl2sql_api_key
      # Required: compose refuses to start without it.
      NL2SQL_CORS_ALLOW_ORIGINS: ${NL2SQL_CORS_ALLOW_ORIGINS:?set NL2SQL_CORS_ALLOW_ORIGINS (JSON array) in .env}
      # Optional: LLM provider key (can also be configured at runtime via the config API).
      # An optional secret cannot be a compose file secret; see the runbook for NVIDIA_API_KEY_FILE.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    secrets:
      - nl2sql_api_key
    volumes:
      - sqlgen_data:/app/data
      - sqlgen_uploads:/app/uploads
      - sqlgen_qdrant:/app/qdrant_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build: ./frontend
    image: sqlgen-frontend:${SQLGEN_IMAGE_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SQLGEN_FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  nl2sql_api_key:
    # Host file holding only the key; must be readable by the container's non-root user (0444).
    file: ${SQLGEN_API_KEY_SECRET_FILE:?set SQLGEN_API_KEY_SECRET_FILE (path to the API key file) in .env}

volumes:
  sqlgen_data:
  sqlgen_uploads:
  sqlgen_qdrant:
